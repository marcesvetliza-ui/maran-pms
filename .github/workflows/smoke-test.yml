name: Smoke Test — Producción

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    name: Verificar sistema en producción
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Verificar revisión exacta y disponibilidad
        run: node scripts/wait-for-revision.js https://maranpms.com.ar "$GITHUB_SHA"

      - name: Correr smoke tests
        run: node scripts/smoke-test.js https://maranpms.com.ar admin ${{ secrets.SMOKE_TEST_PASSWORD }}

      - name: Notificar resultado en GitHub
        if: failure()
        run: |
          echo "::error::❌ Smoke test falló en producción — revisar maranpms.com.ar"
