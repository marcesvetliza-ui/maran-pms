name: Smoke Test — Producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Verificar sistema en producción
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout código
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Probar verificador de despliegue
        run: node scripts/wait-for-revision.test.js

      - name: Verificar revisión exacta y disponibilidad
        run: node scripts/wait-for-revision.js https://maranpms.com.ar "$GITHUB_SHA"

      - name: Correr smoke tests
        run: node scripts/smoke-test.js https://maranpms.com.ar admin ${{ secrets.SMOKE_TEST_PASSWORD }}

      - name: Notificar resultado en GitHub
        if: failure()
        run: |
          echo "::error::❌ Verificación de producción fallida. Revisar el paso anterior: puede ser espera de despliegue o smoke funcional; este aviso por sí solo no confirma una caída."
