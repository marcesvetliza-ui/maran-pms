name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Correr suite completa (client + server + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maran_test
      # Evita que npm haga una llamada de red en segundo plano para chequear
      # si hay una versión más nueva de npm disponible. Esa llamada cuelga en
      # este runner y dispara el bug "Exit handler never called!" de npm
      # (ver npm/cli#7657) justo al terminar la instalación.
      NPM_CONFIG_UPDATE_NOTIFIER: "false"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: |
          # `npm ci` dispara de forma reproducible el bug "Exit handler never
          # called!" de npm en este runner (ver npm/cli#7657). `npm install`
          # usa una ruta de reify distinta que no lo activa; mantenemos
          # también un fallback a npm ci con reintentos por si reaparece.
          for i in 1 2 3; do
            echo "Intento $i de npm install..."
            if npm install --no-audit --no-fund; then
              echo "npm install OK"
              exit 0
            fi
            echo "npm install falló en el intento $i, reintentando..."
            rm -rf node_modules
            sleep 5
          done
          echo "npm install falló luego de 3 intentos"
          exit 1

      - name: Preparar esquema de PostgreSQL para tests de integración
        run: npm run db:migrate:ci

      - name: Correr npm test (client + server + PostgreSQL)
        run: npm test
