name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Correr suite completa (client + server + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maran_test
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      # Habilita server/tests/auth-bootstrap-concurrency.pg.test.ts — un test
      # que ejercita un endpoint destructivo (POST /api/auth/setup) sobre el
      # Postgres descartable que este mismo job levanta arriba. Nunca debe
      # configurarse en un entorno real.
      ALLOW_DESTRUCTIVE_PG_TESTS: "true"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar URLs del lockfile npm
        run: |
          # GitHub Actions cannot reach Replit's internal package proxy. Fail before
          # setup/install so a regenerated lockfile does not waste CI time.
          if grep -Fq "package-firewall.replit.local" package-lock.json; then
            echo "::error file=package-lock.json::El lockfile contiene URLs del proxy interno package-firewall.replit.local, inaccesibles desde GitHub Actions."
            echo "Regenera el lockfile usando registry.npmjs.org antes de volver a ejecutar CI."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Preparar esquema de PostgreSQL para tests de integración
        run: npm run db:migrate:ci

      - name: Correr npm test (client + server + PostgreSQL)
        run: npm test
